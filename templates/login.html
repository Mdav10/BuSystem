<!DOCTYPE html>
<html>
<head>
    <title>BuSystem</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#00d4ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-512.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e17 0%, #1a2a3f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e6ed;
            -webkit-tap-highlight-color: transparent;
            padding: 16px;
        }
        .login-box {
            background: #111a2b;
            padding: 50px 40px;
            border-radius: 24px;
            border: 1px solid #1a2a3f;
            width: 400px;
            max-width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .app-icon { width: 80px; height: 80px; display: block; margin: 0 auto 15px; border-radius: 20px; }
        .logo-text { font-size: 36px; font-weight: bold; color: #00d4ff; text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #7a8ba3; margin-bottom: 30px; font-size: 14px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #7a8ba3; }
        .input-group input {
            width: 100%;
            padding: 14px;
            background: #0f1a2b;
            border: 1px solid #1a2a3f;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            transition: 0.3s;
            -webkit-appearance: none;
        }
        .input-group input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0,212,255,0.1);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #00d4ff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #0a0e17;
            cursor: pointer;
            transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-login:active { transform: scale(0.96); }
        .btn-login:hover { background: #00ff88; transform: scale(1.02); }
        .error { color: #ff4757; text-align: center; margin-bottom: 15px; font-size: 14px; }
        .footer { text-align: center; margin-top: 20px; color: #4a5a6f; font-size: 12px; }

        /* Install Button Styles */
        .install-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }
        .install-btn.ready {
            background: #00d4ff;
            color: #0a0e17;
        }
        .install-btn.ready:hover {
            background: #00ff88;
            transform: scale(1.02);
        }
        .install-btn.downloading {
            background: #f39c12;
            color: #fff;
            cursor: wait;
        }
        .install-btn.downloading::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        .install-btn.installed {
            background: #2ecc71;
            color: #fff;
        }
        .install-btn.installed:hover {
            background: #27ae60;
        }
        .install-btn.error {
            background: #ff4757;
            color: #fff;
        }
        .install-btn.hidden {
            display: none;
        }

        /* Progress bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: #1a2332;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }
        .progress-container.active {
            display: block;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        @media (max-width: 480px) { .login-box { padding: 30px 20px; } }
        @media (display-mode: standalone) {
            .install-btn { display: none !important; }
            .progress-container { display: none !important; }
        }
    </style>
</head>
<body>
<div class="login-box">
    <img src="/static/icons/icon-192.png" alt="BuSystem" class="app-icon">
    <div class="logo-text">BuSys</div>
    <div class="subtitle">Personal Finance OS</div>
    {% with messages = get_flashed_messages() %}
        {% if messages %}<div class="error">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <form method="POST">
        <div class="input-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required autocomplete="username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">🚀 Access</button>
    </form>

    <!-- Install Button - Only shows when supported -->
    <button id="installBtn" class="install-btn hidden ready">
        📲 Install App
    </button>
    <div id="progressContainer" class="progress-container">
        <div id="progressBar" class="progress-bar" style="width: 0%;"></div>
    </div>

    <div class="footer">Every Franc Must Have a Job</div>
</div>

<script>
    let deferredPrompt;
    let isDownloading = false;
    let installBtn = document.getElementById('installBtn');
    let progressContainer = document.getElementById('progressContainer');
    let progressBar = document.getElementById('progressBar');

    // Check if already installed
    function isInstalled() {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    }

    if (isInstalled()) {
        installBtn.classList.add('hidden');
        installBtn.classList.remove('ready');
    }

    // Listen for install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        
        // Show the install button
        installBtn.classList.remove('hidden');
        installBtn.classList.add('ready');
        installBtn.textContent = '📲 Install App';
        installBtn.disabled = false;
    });

    // Install button click handler
    installBtn.addEventListener('click', async function() {
        if (isDownloading) return;
        
        if (deferredPrompt) {
            // Start downloading state
            isDownloading = true;
            this.classList.remove('ready');
            this.classList.add('downloading');
            this.textContent = '📥 Downloading...';
            this.disabled = true;
            
            // Show progress bar
            progressContainer.classList.add('active');
            
            // Simulate download progress
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 15 + 5;
                if (progress > 100) progress = 100;
                progressBar.style.width = progress + '%';
                
                if (progress >= 100) {
                    clearInterval(interval);
                    
                    // Show the native install prompt
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            // Installed successfully
                            this.classList.remove('downloading');
                            this.classList.add('installed');
                            this.textContent = '✅ Installed!';
                            this.disabled = true;
                            progressContainer.classList.remove('active');
                            progressBar.style.width = '100%';
                            
                            setTimeout(() => {
                                this.classList.add('hidden');
                            }, 3000);
                        } else {
                            // User declined
                            this.classList.remove('downloading');
                            this.classList.add('ready');
                            this.textContent = '📲 Install App';
                            this.disabled = false;
                            progressContainer.classList.remove('active');
                            progressBar.style.width = '0%';
                        }
                        isDownloading = false;
                        deferredPrompt = null;
                    });
                }
            }, 200);
        } else {
            // No install prompt available - fallback
            this.classList.remove('ready');
            this.classList.add('error');
            this.textContent = '⚠️ Use browser menu → "Install App"';
            setTimeout(() => {
                this.classList.remove('error');
                this.classList.add('ready');
                this.textContent = '📲 Install App';
            }, 3000);
        }
    });

    // Handle app installed event
    window.addEventListener('appinstalled', () => {
        installBtn.classList.remove('downloading', 'ready');
        installBtn.classList.add('installed');
        installBtn.textContent = '✅ Installed!';
        installBtn.disabled = true;
        progressContainer.classList.remove('active');
        progressBar.style.width = '100%';
        isDownloading = false;
        
        setTimeout(() => {
            installBtn.classList.add('hidden');
        }, 3000);
    });

    // Show install button if PWA is supported but prompt not triggered yet
    setTimeout(() => {
        if (!installBtn.classList.contains('hidden') && !deferredPrompt) {
            // Check if already installed
            if (!isInstalled()) {
                installBtn.classList.remove('hidden');
                installBtn.classList.add('ready');
                installBtn.textContent = '📲 Install App';
            }
        }
    }, 3000);
</script>
</body>
</html>
